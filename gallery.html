<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <link rel="stylesheet" href="styles.css">

<body>
  <a class="skip-link" href="#main">Skip to main content</a>
  <header class="site-header">
    <p class="brand">Leaf Desk</p>
    <nav aria-label="Main navigation">
      <ul class="nav-list">
        <li><a href="index.html">Home</a></li>
        <li><a href="gallery.html" aria-current="page">Plant gallery</a></li>
        <li><a href="care.html">Care tips</a></li>
      </ul>
    </nav>
  </header>
  <main id="main">
    <h1>Plant gallery</h1>
    <p class="lead">Six compact plants that do well indoors. Hover over a photo to bring it forward.</p>
    <div class="gallery">
      <figure>
        <img src="images/monstera.svg" alt="Illustration of a monstera with large split leaves in a terracotta pot" width="600" height="450">
        <figcaption>Monstera: bright, indirect light</figcaption>
      </figure>
      <figure>
        <img src="images/snake-plant.svg" alt="Illustration of a snake plant with tall upright leaves in a navy pot" width="600" height="450">
        <figcaption>Snake plant: tolerates low light</figcaption>
      </figure>
      <figure>
        <img src="images/succulent.svg" alt="Illustration of a rosette succulent in a green pot" width="600" height="450">
        <figcaption>Succulent: loves a sunny sill</figcaption>
      </figure>
      <figure>
        <img src="images/pothos.svg" alt="Illustration of a pothos with trailing vines in a yellow pot" width="600" height="450">
        <figcaption>Pothos: trails from a high shelf</figcaption>
      </figure>
      <figure>
        <img src="images/cactus.svg" alt="Illustration of a cactus with a red flower in a brown pot" width="600" height="450">
        <figcaption>Cactus: water very rarely</figcaption>
      </figure>
      <figure>
        <img src="images/fern.svg" alt="Illustration of a fern with arching fronds in a purple pot" width="600" height="450">
        <figcaption>Fern: likes humid air</figcaption>
      </figure>
    </div>
  </main>
  <footer class="site-footer"><p>Leaf Desk &ndash; a small-space plant guide. Student project for Web Programming.</p></footer>
